services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: worldoflamps
      POSTGRES_USER: worldoflamps
      POSTGRES_PASSWORD: worldoflamps_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worldoflamps"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./services/auth
    environment:
      DATABASE_URL: postgresql+asyncpg://worldoflamps:worldoflamps_secret@postgres:5432/worldoflamps
      JWT_SECRET: worldoflamps_jwt_secret_change_in_prod
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 60
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8003:8003"

  products-service:
    build: ./services/products
    environment:
      DATABASE_URL: postgresql+asyncpg://worldoflamps:worldoflamps_secret@postgres:5432/worldoflamps
      UPLOAD_DIR: /app/uploads
      JWT_SECRET: worldoflamps_jwt_secret_change_in_prod
      JWT_ALGORITHM: HS256
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    ports:
      - "8001:8001"

  orders-service:
    build: ./services/orders
    environment:
      DATABASE_URL: postgresql+asyncpg://worldoflamps:worldoflamps_secret@postgres:5432/worldoflamps
      JWT_SECRET: worldoflamps_jwt_secret_change_in_prod
      JWT_ALGORITHM: HS256
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8002:8002"

volumes:
  pgdata:
  uploads:
